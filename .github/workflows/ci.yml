name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"     # every Monday: catch what a new Hermes release changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pyyaml ruamel.yaml
      - run: cd tests && python -m pytest -q
      - run: python demo/replay.py

  windows:
    # Windows paths (GHSA-w8j8-5ph5-rrff): the whole suite, plus what only Windows shows (tests/test_windows.py).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pyyaml ruamel.yaml
      - run: cd tests && python -m pytest -q -rs
      - run: python demo/replay.py

  hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate, doctor and end-to-end test in the official Hermes image
        run: scripts/test_in_hermes_image.sh nousresearch/hermes-agent:latest
